<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Specimen — Cormorant Garamond</title>
  <link rel="stylesheet" href="cormorant.css">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #283221; color: #eed487; }
    main { width: min(92vw, 1100px); padding: 4rem 1rem; text-align: center; }
    h1 { margin: 0; font: 500 clamp(3.5rem, 12vw, 9rem)/.92 "Cormorant Garamond", Georgia, serif; }
    p { font: 400 clamp(1.2rem, 2.2vw, 2rem)/1.5 "Cormorant Garamond", Georgia, serif; }
    .alphabet { overflow-wrap: anywhere; letter-spacing: .04em; }
    .weights { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
    .weights span { font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Tenuta<br>Catalano</h1>
    <p>À È É Ì Ò Ù · à è é ì ò ù</p>
    <p class="alphabet">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 — “ ” ‘ ’ € &amp; @</p>
    <p class="weights"><span style="font-weight:300">Light 300</span><span style="font-weight:400">Regular 400</span><span style="font-weight:500">Medium 500</span><span style="font-weight:600">SemiBold 600</span><span style="font-weight:700">Bold 700</span></p>
  </main>
</body>
</html>
